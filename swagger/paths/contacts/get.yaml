tags: [Contacts]
summary: List the authenticated user's contacts
operationId: getContacts
description: Returns a paginated, sortable list of contacts owned by the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema: { type: integer, minimum: 1, default: 1 }
  - in: query
    name: perPage
    schema: { type: integer, minimum: 1, default: 10 }
  - in: query
    name: sortBy
    schema: { type: string, enum: [name, phoneNumber, email, isFavourite, contactType, createdAt, updatedAt] }
  - in: query
    name: sortOrder
    schema: { type: string, enum: [asc, desc], default: asc }
  - in: query
    name: type
    description: Filter by contact type (the contactType alias is also accepted).
    schema: { type: string, enum: [work, home, personal] }
  - in: query
    name: isFavourite
    schema: { type: boolean }
responses:
  '200':
    description: Contacts and pagination metadata.
    content:
      application/json:
        schema:
          type: object
          properties:
            status: { type: integer, example: 200 }
            message: { type: string, example: Successfully found contacts! }
            data:
              type: object
              properties:
                data:
                  type: array
                  items: { $ref: '../../components/schemas.yaml#/Contact' }
                page: { type: integer }
                perPage: { type: integer }
                totalItems: { type: integer }
                totalPages: { type: integer }
                hasPreviousPage: { type: boolean }
                hasNextPage: { type: boolean }
  '401':
    description: Missing, invalid, or expired access token.
    content:
      application/json:
        schema: { $ref: '../../components/schemas.yaml#/Error' }
