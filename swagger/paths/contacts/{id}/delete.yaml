tags: [Contacts]
summary: Delete a contact
operationId: deleteContact
description: Deletes a contact owned by the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
responses:
  '204':
    description: Contact deleted; the response has no body.
  '401':
    description: Missing, invalid, or expired access token.
    content:
      application/json:
        schema: { $ref: '../../../components/schemas.yaml#/Error' }
  '404':
    description: Contact not found for this user.
    content:
      application/json:
        schema: { $ref: '../../../components/schemas.yaml#/Error' }
