tags: [Contacts]
summary: Get one contact
operationId: getContactById
description: Returns a contact by ID if it belongs to the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: MongoDB ID of the contact.
    schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
responses:
  '200':
    description: Contact found.
    content:
      application/json:
        schema:
          type: object
          properties:
            status: { type: integer, example: 200 }
            message: { type: string, example: Successfully found contact with id 65ca67e7ae7f10c88b5982e3! }
            data: { $ref: '../../../components/schemas.yaml#/Contact' }
  '401':
    description: Missing, invalid, or expired access token.
    content:
      application/json:
        schema: { $ref: '../../../components/schemas.yaml#/Error' }
  '404':
    description: Contact not found for this user.
    content:
      application/json:
        schema: { $ref: '../../../components/schemas.yaml#/Error' }
