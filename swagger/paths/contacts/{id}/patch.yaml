tags: [Contacts]
summary: Update a contact
operationId: patchContact
description: Updates fields for a contact owned by the authenticated user. Send multipart form data to replace or add a photo.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name: { type: string, minLength: 3, maxLength: 20 }
          phoneNumber: { type: string, minLength: 3, maxLength: 20 }
          email: { type: string, format: email }
          isFavourite: { type: boolean }
          contactType: { type: string, enum: [work, home, personal] }
          photo: { type: string, format: binary }
responses:
  '200':
    description: Contact updated.
    content:
      application/json:
        schema:
          type: object
          properties:
            status: { type: integer, example: 200 }
            message: { type: string, example: Successfully patched a contact! }
            data: { $ref: '../../../components/schemas.yaml#/Contact' }
  '401':
    description: Missing, invalid, or expired access token.
    content:
      application/json:
        schema: { $ref: '../../../components/schemas.yaml#/Error' }
  '404':
    description: Contact not found for this user.
    content:
      application/json:
        schema: { $ref: '../../../components/schemas.yaml#/Error' }
