openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: API for authenticated users to manage their contacts, accounts, and password reset flow.
tags:
  - name: Contacts
    description: Authenticated contact management.
  - name: Authentication
    description: Account registration, login, session, and password reset.
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://nodejs-hw-mongodb-jd1g.onrender.com
    description: Render deployment
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque access token
